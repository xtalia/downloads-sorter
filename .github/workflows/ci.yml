name: Native tests and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.variant }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            variant: modern
          - os: windows-latest
            variant: legacy
          - os: ubuntu-latest
            variant: linux
          - os: macos-latest
            variant: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      SORTER_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Native end-to-end and packaged smoke tests
        run: python -m unittest discover -s tests -v

  release:
    name: Build draft release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Build reproducible ZIPs
        shell: bash
        run: python tools/build_release.py --version "${GITHUB_REF_NAME#v}"
      - name: Prepare draft for final asset verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip dist/sort-downloads.py dist/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --verify-tag --draft
          --title "$GITHUB_REF_NAME — Downloads Sorter"
          --notes-file .github/release-notes.md
